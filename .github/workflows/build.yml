name: Build

on:
  push:
    branches: [main]
  pull_request:
  workflow_dispatch:

permissions:
  contents: read

jobs:
  build:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    strategy:
      fail-fast: false
      matrix:
        minecraft: ['26.3', '26.2', '26.1', '1.21.11']
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1
        with:
          persist-credentials: false
      - uses: actions/setup-java@77dd5b2ce225ea11469928ac317850245a74ae78
        with:
          distribution: temurin
          java-version: '25'
      - uses: gradle/actions/setup-gradle@8da46b539cd8fe6ab27ca75128919a18d757604c
      - name: Build and test
        run: ./gradlew build -Pminecraft_version=${{ matrix.minecraft }} --no-daemon
      - uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9
        with:
          name: fungus-heart-indicator-${{ matrix.minecraft }}
          path: |
            build/${{ matrix.minecraft }}/libs/*.jar
            !build/${{ matrix.minecraft }}/libs/*-sources.jar
          if-no-files-found: error
